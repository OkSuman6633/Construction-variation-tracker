[project]
name = "cvea-backend"
version = "0.1.0"
description = "Construction Variation Evidence Agent - API, worker and ADK agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "google-adk==2.13.0",
  "google-cloud-storage>=2.18",
  "google-cloud-bigquery>=3.25",
  "google-cloud-tasks>=2.16",
  "google-cloud-secret-manager>=2.20",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "Pillow>=10.4",
  "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "construction_variation_agent*"]
exclude = ["tests*", "scripts*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "E501", "F841"]
"scripts/*" = ["E501", "S101"]
"**/prompt.py" = ["E501"]
"construction_variation_agent/tools/*" = ["E501"]
"construction_variation_agent/prompt.py" = ["E501"]
"app/analysis/engine.py" = ["E501"]
"app/routers/evidence_jobs.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestDeprecationWarning"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
